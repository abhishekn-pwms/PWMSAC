            <div style="display: flex; gap:8px;">

                <button class="btn btn-secondary" onclick="sendOtpCode()">Send Code</button>
            </div>

            <div id="otpCodeRow" style="display:none; gap:8px; margin-top:8px;">

            <div id="errorMessage"></div>

            <text class="login-workspace-tag">Abhi's Workspace</text>

            <text id="loginHostname" style="text-align: center;"></text>

            <script>
                document.getElementById("loginHostname").textContent = "-- " + window.location.host + APP_BASE + " --";
